# Push to the 'release' branch to build Capri.exe on Windows and publish a ready-to-run zip as a
# release named after the VERSION file (bump it for each new release).
# The zip has no voices folder (recorded dialogue is not ours to share); Capri runs without it.
# It also leaves out the pose sheets, which only the sprite tools need.
name: Release
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Capri.exe
        shell: pwsh
        run: dotnet build src/Capri/Capri.csproj -c Release -nologo
      - name: Package
        shell: pwsh  # PowerShell 7's Compress-Archive writes standard forward-slash zip paths
        run: |
          $out = 'Capri-Companion'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item src/Capri/bin/Release/net48/Capri.exe $out
          # Capri.exe and README.txt on top; her data in data\, drawings and sounds in their folders.
          # (save\ and logs\ are made by Capri on first start.)
          foreach($item in @('README.txt','sprites','sounds')){ Copy-Item $item $out -Recurse }
          New-Item -ItemType Directory "$out/data" | Out-Null
          foreach($item in @('VERSION','menu-theme.xaml')){ Copy-Item $item "$out/data" }
          Get-ChildItem *.json | Copy-Item -Destination "$out/data"
          Compress-Archive -Path $out -DestinationPath Capri-Companion.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          gh release create "$version" Capri-Companion.zip --target "$GITHUB_SHA" --title "Capri $version" --notes "Unzip anywhere and run Capri.exe. Windows may show a SmartScreen warning the first time because the exe is not signed (More info > Run anyway). Voices are not included."
