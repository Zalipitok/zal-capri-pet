# Push a tag like v2.1.0 to build Capri.exe on Windows and publish a ready-to-run zip as a release.
# The zip has no voices folder (recorded dialogue is not ours to share); Capri runs without it.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Capri.exe
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Build-Exe.ps1
      - name: Package
        shell: powershell
        run: |
          $out = 'Capri-Companion'
          New-Item -ItemType Directory $out | Out-Null
          foreach($item in @('Capri.exe','capri.ico','Capri.ps1','Capri.vbs','Start-Capri.bat','Run-SelfTest.bat','README.txt','menu-theme.xaml','lib','sprites','sounds','tools')){
            if(Test-Path $item){ Copy-Item $item $out -Recurse }
          }
          Get-ChildItem *.png, *.json | Copy-Item -Destination $out
          Compress-Archive -Path $out -DestinationPath Capri-Companion.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" Capri-Companion.zip --title "Capri $GITHUB_REF_NAME" --notes "Unzip anywhere and run Capri.exe (or Capri.vbs). Windows may show a SmartScreen warning the first time because the exe is not signed. Voices are not included."
